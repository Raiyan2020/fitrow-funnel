<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FitRow - خطة تمرين مخصصة</title>
    <link rel="icon" href="https://raiyansoft.com/wp-content/uploads/2026/01/App-icon-s.png" />
    <link rel="preload" as="image" href="https://raiyansoft.com/wp-content/uploads/2026/01/App-icon-s.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#0a0a0a',
                surface: '#121212',
                lime: 'rgb(var(--brand-lime) / <alpha-value>)',
                limeHover: 'rgb(var(--brand-lime-hover) / <alpha-value>)',
                gray: '#262626',
              }
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.2s ease-out forwards',
              'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              alexandria: ['Alexandria', 'sans-serif'],
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-lime: 208 253 124;
        --brand-lime-hover: 180 230 110;
      }
      html, body, #root {
        height: 100%;
        overflow: hidden;
      }
      body {
        background-color: #050505;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Custom scrollbar hide */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .glass-panel {
        background: rgba(30, 30, 30, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      @keyframes innerPulse {
        0% {
          transform: translate(-50%, -50%) scale(0.92);
          opacity: 0.45;
          filter: blur(20px);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
          opacity: 0.85;
          filter: blur(35px);
        }
        100% {
          transform: translate(-50%, -50%) scale(0.92);
          opacity: 0.45;
          filter: blur(20px);
        }
      }
      @keyframes outerPulse {
        0% {
          transform: scale(0.95);
          opacity: 0.18;
          filter: blur(35px);
        }
        50% {
          transform: scale(1.22);
          opacity: 0.45;
          filter: blur(52px);
        }
        100% {
          transform: scale(0.95);
          opacity: 0.18;
          filter: blur(35px);
        }
      }
      @keyframes outerDrift {
        0% {
          transform: translate(calc(-50% - 6px), calc(-50% - 4px));
        }
        25% {
          transform: translate(calc(-50% + 5px), calc(-50% - 6px));
        }
        50% {
          transform: translate(calc(-50% + 7px), calc(-50% + 5px));
        }
        75% {
          transform: translate(calc(-50% - 4px), calc(-50% + 6px));
        }
        100% {
          transform: translate(calc(-50% - 6px), calc(-50% - 4px));
        }
      }
      .animate-inner-glow {
        animation: innerPulse 2.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        will-change: transform, opacity, filter;
      }
      .animate-outer-glow {
        animation: outerPulse 3.3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        will-change: transform, opacity, filter;
      }
      .animate-outer-drift {
        animation: outerDrift 7.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        will-change: transform;
      }
      @keyframes pulseGlow {
        0% {
          transform: scale(0.92);
          opacity: 0.15;
          filter: blur(16px);
        }
        50% {
          transform: scale(1.1);
          opacity: 0.35;
          filter: blur(24px);
        }
        100% {
          transform: scale(0.92);
          opacity: 0.15;
          filter: blur(16px);
        }
      }
      .animate-pulse-glow {
        animation: pulseGlow 2.2s ease-in-out infinite;
        will-change: transform, opacity, filter;
      }

      /* Custom Range Slider Thumb */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 40px;
        width: 40px;
        border-radius: 50%;
        background: rgb(var(--brand-lime));
        cursor: pointer;
        box-shadow: 0 0 15px rgba(208, 253, 124, 0.5);
        margin-top: -16px; /* Center thumb on the track (40-8)/2 = 16 */
      }
      input[type="range"]::-moz-range-thumb {
        height: 40px;
        width: 40px;
        border-radius: 50%;
        background: rgb(var(--brand-lime));
        border: none;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(208, 253, 124, 0.5);
      }
      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 8px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
      }
      input[type="range"]::-moz-range-track {
        width: 100%;
        height: 8px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
      }

      .quizScrollArea {
        height: 100%;
        max-height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding-bottom: calc(120px + env(safe-area-inset-bottom));
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
