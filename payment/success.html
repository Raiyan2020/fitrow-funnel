<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FitRow - تم الدفع بنجاح</title>
  <link rel="icon" href="https://raiyansoft.com/wp-content/uploads/2026/01/App-icon-s.png" />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-lime: 208 253 124;
      --brand-dark: #0a0a0a;
    }

    body {
      background-color: var(--brand-dark);
      color: #ffffff;
      font-family: 'Alexandria', 'Inter', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      position: relative;
      gap: 0;
    }

    /* Animated background glow */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: rgb(var(--brand-lime) / 0.12);
      border-radius: 50%;
      filter: blur(80px);
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.9); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes checkPop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeSlideUp 0.5s ease-out forwards;
    }

    /* Check icon */
    .check-container {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check-ripple {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgb(var(--brand-lime) / 0.5);
      animation: ripple 1.8s ease-out infinite;
    }
    .check-ripple:nth-child(2) { animation-delay: 0.6s; }
    .check-ripple:nth-child(3) { animation-delay: 1.2s; }
    .check-circle {
      width: 80px;
      height: 80px;
      background: rgb(var(--brand-lime));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgb(var(--brand-lime) / 0.5);
      animation: checkPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    /* Texts */
    .title {
      font-size: 1.875rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #9ca3af;
      max-width: 280px;
      line-height: 1.6;
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgb(var(--brand-lime) / 0.12);
      border: 1px solid rgb(var(--brand-lime) / 0.3);
      color: rgb(var(--brand-lime));
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgb(var(--brand-lime));
      animation: glowPulse 1.5s ease-in-out infinite;
    }

    /* CTA Button */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 320px;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: rgb(var(--brand-lime));
      color: #0a0a0a;
      box-shadow: 0 0 24px rgb(var(--brand-lime) / 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 36px rgb(var(--brand-lime) / 0.55);
    }
    .btn-primary:active { transform: scale(0.97); }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .secure-note {
      font-size: 0.7rem;
      color: #4b5563;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="wrapper">
    <div class="content">

      <!-- Animated check icon -->
      <div class="check-container">
        <div class="check-ripple"></div>
        <div class="check-ripple"></div>
        <div class="check-ripple"></div>
        <div class="check-circle">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>

      <!-- Badge -->
      <div class="badge">
        <span class="badge-dot"></span>
        تم الدفع بنجاح
      </div>

      <!-- Title & subtitle -->
      <div style="display:flex;flex-direction:column;gap:0.5rem;">
        <h1 class="title">🎉 أهلاً بك في FitRow!</h1>
        <p class="subtitle">تم تأكيد اشتراكك بنجاح. حمّل التطبيق الآن وابدأ رحلتك نحو جسم أفضل.</p>
      </div>

      <!-- CTA -->
      <div class="actions">
        <a href="https://onelink.to/fitrow" target="_blank" class="btn btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="currentColor" stroke="none"/>
            <path d="M8 12l4 4 4-4M12 8v8" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          تحميل تطبيق FitRow
        </a>
        <p class="secure-note">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          اشتراكك محمي ومشفر
        </p>
      </div>

    </div>
  </div>
</body>
</html>
