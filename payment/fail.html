<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FitRow - فشل الدفع</title>
  <link rel="icon" href="https://raiyansoft.com/wp-content/uploads/2026/01/App-icon-s.png" />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-lime: 208 253 124;
      --brand-dark: #0a0a0a;
      --brand-red: 239 68 68;
    }

    body {
      background-color: var(--brand-dark);
      color: #ffffff;
      font-family: 'Alexandria', 'Inter', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .wrapper {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      position: relative;
    }

    /* Animated background glow */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: rgb(var(--brand-red) / 0.1);
      border-radius: 50%;
      filter: blur(80px);
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.9); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes iconPop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeSlideUp 0.5s ease-out forwards;
    }

    /* X icon */
    .icon-container {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      background: rgb(var(--brand-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgb(var(--brand-red) / 0.4);
      animation: iconPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
    }
    .icon-circle svg {
      animation: shake 0.5s ease-out 0.7s;
    }

    /* Texts */
    .title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      max-width: 280px;
      line-height: 1.6;
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgb(var(--brand-red) / 0.1);
      border: 1px solid rgb(var(--brand-red) / 0.3);
      color: rgb(var(--brand-red));
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Cards */
    .info-card {
      width: 100%;
      max-width: 320px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .info-card p {
      font-size: 0.8rem;
      color: #6b7280;
      line-height: 1.5;
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 320px;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-decoration: none;
      font-family: inherit;
    }
    .btn-primary {
      background: rgb(var(--brand-lime));
      color: #0a0a0a;
      box-shadow: 0 0 24px rgb(var(--brand-lime) / 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 36px rgb(var(--brand-lime) / 0.5);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #d1d5db;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-1px);
    }
    .btn:active { transform: scale(0.97); }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 320px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .divider span {
      font-size: 0.7rem;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="wrapper">
    <div class="content">

      <!-- X icon -->
      <div class="icon-container">
        <div class="icon-circle">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
      </div>

      <!-- Badge -->
      <div class="badge">⚠ فشلت عملية الدفع</div>

      <!-- Title & subtitle -->
      <div style="display:flex;flex-direction:column;gap:0.5rem;">
        <h1 class="title">لم تكتمل عملية الدفع</h1>
        <p class="subtitle">لم يتم خصم أي مبلغ من حسابك. يمكنك المحاولة مرة أخرى أو التواصل معنا للمساعدة.</p>
      </div>

      <!-- Info card -->
      <div class="info-card">
        <p>💡 تأكد من صحة بيانات البطاقة أو جرّب طريقة دفع مختلفة.</p>
      </div>

      <!-- Actions -->
      <div class="actions">
        <a href="/" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          العودة والمحاولة مجدداً
        </a>

        <div class="divider"><span>أو</span></div>

        <a href="https://onelink.to/fitrow" target="_blank" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="#0a0a0a" stroke="none"/>
            <path d="M8 12l4 4 4-4M12 8v8" stroke="rgb(208 253 124)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          تحميل التطبيق مجاناً
        </a>
      </div>

    </div>
  </div>
</body>
</html>
